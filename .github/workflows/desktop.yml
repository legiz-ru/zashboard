name: Desktop

# Builds the Electron desktop app (dashboard + bundled mihomo kernel) for
# Windows, macOS and Linux. Runs when a release is published, when the release
# pipeline calls it after release-please cuts a tag, and on demand for a test
# build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload the installers to (leave empty to only keep them as workflow artifacts)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

# release-please's release can reach this workflow through both the `release`
# event and the pipeline's workflow_call, so builds are keyed on the tag: two
# runs for the same release would otherwise race to upload the same filenames.
concurrency:
  group: desktop-${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      # The tag to attach the installers to, whichever way this run started.
      # Empty for a plain workflow_dispatch: the build then only produces
      # workflow artifacts.
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6

      # electron-builder drives fpm for the deb/rpm targets, and fpm shells out
      # to rpmbuild — which the Ubuntu runner image does not ship.
      - name: Install rpm tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: pnpm i

      # pnpm may skip electron's postinstall depending on the workspace's build
      # allowlist; this makes the runtime's presence explicit rather than a
      # confusing electron-builder failure later.
      - name: Ensure the Electron runtime
        run: pnpm --filter @zashboard/desktop ensure:electron

      - name: Build the dashboard
        run: pnpm --filter zashboard build

      - name: Stage the dashboard into the shell
        run: pnpm --filter @zashboard/desktop copy:renderer

      - name: Bundle main and preload
        run: pnpm --filter @zashboard/desktop build

      # release-please only bumps the root package; the installers take their
      # version (and filenames) from the desktop package.
      - name: Sync the desktop package version
        run: pnpm --filter @zashboard/desktop sync:version

      - name: Package installers
        env:
          # Unsigned builds: stop electron-builder from hunting for a keychain
          # identity on macOS and failing when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @zashboard/desktop exec electron-builder --${{ matrix.platform }} --publish never

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zashboard-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/latest*.yml

      - name: Upload to the GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
