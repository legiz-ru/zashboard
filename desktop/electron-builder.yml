appId: zashboard.desktop
productName: zashboard
# Explicit, filesystem-safe executable name: derived from the package name it
# would become "@zashboarddesktop", which the AppImage builder rejects.
executableName: zashboard
copyright: Copyright © zashboard contributors
# Subscription "one-click import" links. REQUIRED on macOS:
# app.setAsDefaultProtocolClient only works for schemes already declared in the
# bundle's Info.plist, so without this the clash:// links never reach the app.
protocols:
  - name: Clash Subscription
    schemes:
      - clash
      - clashmeta
# Re-stage the arch-correct mihomo before EACH arch is packed — one run builds
# both x64 and arm64 from a single host. See scripts/before-pack.cjs.
beforePack: scripts/before-pack.cjs
# No auto-update channel: without this, electron-builder tries to auto-detect a
# GitHub publish provider and fails before it ever reaches the packing step.
publish: null

directories:
  output: dist
  buildResources: build

files:
  - 'out/**/*'
  - 'package.json'
  # electron-builder adds the app's production dependencies on top of `files`,
  # and in a pnpm workspace it resolves them from the WORKSPACE ROOT — which is
  # the dashboard, whose deps (echarts, misans, three, …) are ~225 MB. None of
  # them are needed at runtime: the dashboard ships pre-built in resources/
  # renderer, and main/preload are bundled into out/. Without this the packaged
  # app.asar grows from ~1 MB to ~227 MB.
  - '!**/node_modules/**/*'

asar: true

# The dashboard, the kernel and the seed config all live outside the asar: the
# kernel must be a real, executable on-disk file, and serving the renderer from
# a plain directory keeps asset resolution independent of asar internals.
extraResources:
  - from: renderer
    to: renderer
  - from: resources/default-config.yaml
    to: default-config.yaml
  - from: resources/tray.png
    to: tray.png

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  # Unsigned build — a signed one would additionally need network entitlements.
  identity: null
  hardenedRuntime: false
  extraResources:
    - from: resources/mihomo
      to: mihomo
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  icon: build/icon.png
  extraResources:
    - from: resources/mihomo.exe
      to: mihomo.exe
    # mihomo's Windows TUN backend loads this next to the kernel. Only usable
    # when the app runs elevated; harmless otherwise.
    - from: resources/wintun.dll
      to: wintun.dll
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: zashboard

linux:
  icon: build/icon.png
  category: Network
  synopsis: Dashboard for the mihomo kernel, with the kernel bundled
  maintainer: zashboard contributors <noreply@zash.run.place>
  # Electron uses desktopName as the app_id / WM_CLASS; without syncing it the
  # desktop environment does not link the running window to the launcher entry.
  syncDesktopName: true
  desktop:
    entry:
      Keywords: mihomo;clash;proxy;dashboard;
  extraResources:
    - from: resources/mihomo
      to: mihomo
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# fpm-based targets need a lowercase package identifier; it must not be derived
# from productName.
deb:
  packageName: zashboard
rpm:
  packageName: zashboard
